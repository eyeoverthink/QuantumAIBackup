<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Background -->
  <rect width="800" height="800" fill="#0a0a14" />

  <!-- Grid Lines -->
  <g stroke="#182848" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
  </g>

  <!-- Neural Core -->
  <g id="neural-core">
    <circle cx="400" cy="400" r="80" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="400" r="60" fill="none" stroke="#1a8cff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="400" r="40" fill="none" stroke="#3a7aff" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="400" r="20" fill="#0064ff" opacity="0.8">
      <animate attributeName="r" values="20;25;20" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="400" y="405" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">NEURAL CORE</text>
  </g>

  <!-- Perimeter Nodes -->
  <g id="perimeter-node">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#22aadd" stroke-width="1.5">
      <animate attributeName="r" values="12;14;12" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="6" fill="#0088cc" opacity="0.8" />
    <text x="0" y="25" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">PERIMETER NODE</text>
  </g>

  <!-- Place perimeter nodes in a circle around the neural core -->
  <use href="#perimeter-node" x="400" y="250" />
  <use href="#perimeter-node" x="550" y="400" />
  <use href="#perimeter-node" x="400" y="550" />
  <use href="#perimeter-node" x="250" y="400" />
  <use href="#perimeter-node" x="480" y="280" />
  <use href="#perimeter-node" x="520" y="320" />
  <use href="#perimeter-node" x="520" y="480" />
  <use href="#perimeter-node" x="480" y="520" />
  <use href="#perimeter-node" x="320" y="520" />
  <use href="#perimeter-node" x="280" y="480" />
  <use href="#perimeter-node" x="280" y="320" />
  <use href="#perimeter-node" x="320" y="280" />

  <!-- Quantum Computing Nodes (from original design) -->
  <g id="quantum-node">
    <rect x="-35" y="-35" width="70" height="70" rx="5" fill="#151525" stroke="#4488ff" stroke-width="2" />
    <circle cx="0" cy="0" r="15" fill="#0055dd">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="45" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">QUANTUM NODE</text>
  </g>

  <use href="#quantum-node" x="200" y="200" />
  <use href="#quantum-node" x="600" y="200" />
  <use href="#quantum-node" x="200" y="600" />
  <use href="#quantum-node" x="600" y="600" />

  <!-- Intrusion Detection Systems -->
  <g id="intrusion-detection">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#151525" stroke="#ff4444" stroke-width="1.5" />
    <circle cx="-15" cy="0" r="8" fill="#880000" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="15" cy="0" r="8" fill="#cc0000" opacity="0.8">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="35" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">INTRUSION DETECTOR</text>
  </g>

  <use href="#intrusion-detection" x="100" y="100" />
  <use href="#intrusion-detection" x="700" y="100" />
  <use href="#intrusion-detection" x="100" y="700" />
  <use href="#intrusion-detection" x="700" y="700" />

  <!-- Neural Pattern Analyzers -->
  <g id="pattern-analyzer">
    <rect x="-25" y="-30" width="50" height="60" rx="5" fill="#151525" stroke="#88cc44" stroke-width="1.5" />
    <circle cx="0" cy="-15" r="8" fill="#66aa22" opacity="0.8" />
    <rect x="-15" y="0" width="30" height="18" fill="#448800" opacity="0.7" />
    <text x="0" y="35" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">PATTERN ANALYZER</text>
  </g>

  <use href="#pattern-analyzer" x="300" y="150" />
  <use href="#pattern-analyzer" x="500" y="150" />
  <use href="#pattern-analyzer" x="300" y="650" />
  <use href="#pattern-analyzer" x="500" y="650" />

  <!-- Energy Field Disruptors (from original design) -->
  <g id="energy-disruptor">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ff6600" stroke-width="1" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ff8800" stroke-width="1.5" />
    <circle cx="0" cy="0" r="10" fill="#ffaa00" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="45" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">ENERGY DISRUPTOR</text>
  </g>

  <use href="#energy-disruptor" x="100" y="300" />
  <use href="#energy-disruptor" x="700" y="300" />
  <use href="#energy-disruptor" x="100" y="500" />
  <use href="#energy-disruptor" x="700" y="500" />

  <!-- Neural Firewalls -->
  <g id="neural-firewall">
    <rect x="-30" y="-25" width="60" height="50" rx="3" fill="none" stroke="#dd4422" stroke-width="2" />
    <rect x="-25" y="-20" width="50" height="40" rx="2" fill="#881100" opacity="0.6" />
    <path d="M -25,0 L 25,0" stroke="#ff7744" stroke-width="3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </path>
    <text x="0" y="35" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">NEURAL FIREWALL</text>
  </g>

  <use href="#neural-firewall" x="150" y="200" />
  <use href="#neural-firewall" x="650" y="200" />
  <use href="#neural-firewall" x="150" y="600" />
  <use href="#neural-firewall" x="650" y="600" />

  <!-- Interdimensional Disruptors (from original design) -->
  <g id="dimensional-disruptor">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#cc44ff" stroke-width="1" />
    <path d="M -18,-18 L 18,18 M -18,18 L 18,-18" stroke="#cc88ff" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#aa00ff" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="40" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">INTERDIMENSIONAL</text>
    <text x="0" y="50" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">DISRUPTOR</text>
  </g>

  <use href="#dimensional-disruptor" x="300" y="300" />
  <use href="#dimensional-disruptor" x="500" y="300" />
  <use href="#dimensional-disruptor" x="300" y="500" />
  <use href="#dimensional-disruptor" x="500" y="500" />

  <!-- Quantum Decryption Units -->
  <g id="decryption-unit">
    <polygon points="0,-30 25,15 -25,15" fill="none" stroke="#00dd99" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="#00aa77" opacity="0.8">
      <animate attributeName="r" values="12;15;12" dur="4s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="35" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">QUANTUM DECRYPTION</text>
  </g>

  <use href="#decryption-unit" x="300" y="100" />
  <use href="#decryption-unit" x="500" y="100" />
  <use href="#decryption-unit" x="300" y="700" />
  <use href="#decryption-unit" x="500" y="700" />

  <!-- Neural Connections -->
  <g stroke="#4477aa" stroke-width="1" opacity="0.7">
    <!-- Core to perimeter nodes -->
    <path d="M 400,370 L 400,250" />
    <path d="M 430,400 L 550,400" />
    <path d="M 400,430 L 400,550" />
    <path d="M 370,400 L 250,400" />
    <path d="M 420,380 L 480,280" />
    <path d="M 420,420 L 520,480" />
    <path d="M 380,420 L 320,520" />
    <path d="M 380,380 L 320,280" />

    <!-- Connect perimeter nodes in a circle -->
    <path d="M 400,250 L 480,280" />
    <path d="M 480,280 L 520,320" />
    <path d="M 520,320 L 550,400" />
    <path d="M 550,400 L 520,480" />
    <path d="M 520,480 L 480,520" />
    <path d="M 480,520 L 400,550" />
    <path d="M 400,550 L 320,520" />
    <path d="M 320,520 L 280,480" />
    <path d="M 280,480 L 250,400" />
    <path d="M 250,400 L 280,320" />
    <path d="M 280,320 L 320,280" />
    <path d="M 320,280 L 400,250" />

    <!-- Connect to quantum nodes -->
    <path d="M 320,280 L 200,200" />
    <path d="M 520,320 L 600,200" />
    <path d="M 280,480 L 200,600" />
    <path d="M 480,520 L 600,600" />

    <!-- Connect to intrusion detectors -->
    <path d="M 200,200 L 100,100" />
    <path d="M 600,200 L 700,100" />
    <path d="M 200,600 L 100,700" />
    <path d="M 600,600 L 700,700" />

    <!-- Connect to pattern analyzers -->
    <path d="M 350,350 L 300,150" />
    <path d="M 450,350 L 500,150" />
    <path d="M 350,450 L 300,650" />
    <path d="M 450,450 L 500,650" />

    <!-- Connect to energy disruptors -->
    <path d="M 200,200 L 100,300" />
    <path d="M 600,200 L 700,300" />
    <path d="M 200,600 L 100,500" />
    <path d="M 600,600 L 700,500" />

    <!-- Connect to neural firewalls -->
    <path d="M 200,200 L 150,200" />
    <path d="M 600,200 L 650,200" />
    <path d="M 200,600 L 150,600" />
    <path d="M 600,600 L 650,600" />

    <!-- Connect to dimensional disruptors -->
    <path d="M 380,380 L 300,300" />
    <path d="M 420,380 L 500,300" />
    <path d="M 380,420 L 300,500" />
    <path d="M 420,420 L 500,500" />

    <!-- Connect to decryption units -->
    <path d="M 300,300 L 300,100" />
    <path d="M 500,300 L 500,100" />
    <path d="M 300,500 L 300,700" />
    <path d="M 500,500 L 500,700" />
  </g>

  <!-- Data Flow Animations -->
  <g fill="#00ffff">
    <!-- Core to perimeter flows -->
    <circle r="2.5">
      <animateMotion path="M 400,380 L 400,250" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5">
      <animateMotion path="M 420,400 L 550,400" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5">
      <animateMotion path="M 400,420 L 400,550" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5">
      <animateMotion path="M 380,400 L 250,400" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <g fill="#ff8800">
    <!-- Threat detection flows -->
    <circle r="2.5">
      <animateMotion path="M 100,100 L 200,200" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5">
      <animateMotion path="M 700,100 L 600,200" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <g fill="#55dd55">
    <!-- Neural pattern analysis flows -->
    <circle r="2.5">
      <animateMotion path="M 300,150 L 350,350" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5">
      <animateMotion path="M 500,150 L 450,350" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <g fill="#cc44ff">
    <!-- Interdimensional security flows -->
    <circle r="2.5">
      <animateMotion path="M 300,300 L 380,380" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5">
      <animateMotion path="M 500,500 L 420,420" dur="1.9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title and Labels -->
  <text x="400" y="50" fill="#ffffff" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">DIGITAL NEURAL SECURITY SYSTEM</text>
  <text x="400" y="75" fill="#88aaff" font-family="Arial" font-size="12" text-anchor="middle">ADAPTIVE DEFENSIVE ARCHITECTURE</text>

  <!-- System Status Display -->
  <g id="status-panel" transform="translate(50,50)">
    <rect x="0" y="0" width="150" height="100" rx="5" fill="#111122" stroke="#3366aa" stroke-width="1" />
    <text x="75" y="20" fill="#ffffff" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">SYSTEM STATUS</text>

    <g id="status-light">
      <circle cx="15" cy="0" r="5" fill="#22dd22">
        <animate attributeName="fill" values="#22dd22;#88ff88;#22dd22" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="75" y="4" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">ACTIVE</text>
    </g>

    <use href="#status-light" x="0" y="40" />

    <g transform="translate(0,60)">
      <circle cx="15" cy="0" r="5" fill="#2299ff">
        <animate attributeName="fill" values="#2299ff;#88ccff;#2299ff" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="75" y="4" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">NEURAL RESPONSE: OPTIMAL</text>
    </g>

    <g transform="translate(0,80)">
      <circle cx="15" cy="0" r="5" fill="#ffcc22">
        <animate attributeName="fill" values="#ffcc22;#ffee88;#ffcc22" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="75" y="4" fill="#ffffff" font-family="Arial" font-size="9" text-anchor="middle">THREAT LEVEL: LOW</text>
    </g>
  </g>

  <!-- Security Metrics Display -->
  <g id="metrics-panel" transform="translate(600,50)">
    <rect x="0" y="0" width="150" height="100" rx="5" fill="#111122" stroke="#3366aa" stroke-width="1" />
    <text x="75" y="20" fill="#ffffff" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">SECURITY METRICS</text>

    <g transform="translate(10,40)">
      <rect x="0" y="-5" width="130" height="10" rx="2" fill="#222233" />
      <rect x="0" y="-5" width="110" height="10" rx="2" fill="#2255aa">
        <animate attributeName="width" values="110;115;105;110" dur="5s" repeatCount="indefinite" />
      </rect>
      <text x="65" y="15" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle">NEURAL INTEGRITY: 87%</text>
    </g>

    <g transform="translate(10,65)">
      <rect x="0" y="-5" width="130" height="10" rx="2" fill="#222233" />
      <rect x="0" y="-5" width="120" height="10" rx="2" fill="#22aa55">
        <animate attributeName="width" values="120;125;120" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="65" y="15" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle">ENCRYPTION STATUS: 93%</text>
    </g>

    <g transform="translate(10,90)">
      <rect x="0" y="-5" width="130" height="10" rx="2" fill="#222233" />
      <rect x="0" y="-5" width="125" height="10" rx="2" fill="#aa2255">
        <animate attributeName="width" values="125;128;123;125" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="65" y="15" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle">DIMENSIONAL STABILITY: 96%</text>
    </g>
  </g>

  <!-- Coordinate grid markers -->
  <g font-family="monospace" font-size="8" fill="#445566">
    <text x="10" y="200" text-anchor="start">200</text>
    <text x="10" y="400" text-anchor="start">400</text>
    <text x="10" y="600" text-anchor="start">600</text>
    <text x="200" y="15" text-anchor="middle">200</text>
    <text x="400" y="15" text-anchor="middle">400</text>
    <text x="600" y="15" text-anchor="middle">600</text>
  </g>

  <!-- Credit -->
  <text x="400" y="780" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">NEURANET SENTINEL SYSTEM</text>
</svg>