<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Background -->
  <rect width="800" height="800" fill="#0a0a14" />
  
  <!-- Central Core -->
  <circle cx="400" cy="400" r="60" fill="none" stroke="#00a8ff" stroke-width="2">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="400" r="40" fill="none" stroke="#1a8cff" stroke-width="1.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="400" r="20" fill="#0064ff" opacity="0.7">
    <animate attributeName="r" values="20;25;20" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Grid Lines -->
  <g stroke="#182848" stroke-width="0.5">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
  </g>
  
  <!-- Quantum Computing Nodes -->
  <g id="computing-node">
    <rect x="-40" y="-40" width="80" height="80" rx="5" fill="#222" stroke="#4488ff" stroke-width="2" />
    <circle cx="0" cy="0" r="15" fill="#0055dd">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="45" fill="#fff" font-family="Arial" font-size="8" text-anchor="middle">QUANTUM NODE</text>
  </g>
  
  <use href="#computing-node" x="200" y="200" />
  <use href="#computing-node" x="600" y="200" />
  <use href="#computing-node" x="200" y="600" />
  <use href="#computing-node" x="600" y="600" />
  
  <!-- Energy Field Disruptors -->
  <g id="energy-disruptor">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ff6600" stroke-width="1" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ff8800" stroke-width="1.5" />
    <circle cx="0" cy="0" r="15" fill="#ffaa00" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="50" fill="#fff" font-family="Arial" font-size="8" text-anchor="middle">ENERGY DISRUPTOR</text>
  </g>
  
  <use href="#energy-disruptor" x="100" y="300" />
  <use href="#energy-disruptor" x="700" y="300" />
  <use href="#energy-disruptor" x="100" y="500" />
  <use href="#energy-disruptor" x="700" y="500" />
  
  <!-- Base Code Decryption -->
  <g id="code-decryption">
    <polygon points="0,-30 25,15 -25,15" fill="none" stroke="#00dd99" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="#00aa77" opacity="0.8">
      <animate attributeName="r" values="12;15;12" dur="4s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="35" fill="#fff" font-family="Arial" font-size="8" text-anchor="middle">CODE DECRYPTION</text>
  </g>
  
  <use href="#code-decryption" x="300" y="100" />
  <use href="#code-decryption" x="500" y="100" />
  <use href="#code-decryption" x="300" y="700" />
  <use href="#code-decryption" x="500" y="700" />
  
  <!-- Interdimensional Disruptors -->
  <g id="dimensional-disruptor">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#cc44ff" stroke-width="1" />
    <path d="M -20,-20 L 20,20 M -20,20 L 20,-20" stroke="#cc88ff" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#aa00ff" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="40" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">INTERDIMENSIONAL</text>
    <text x="0" y="50" fill="#fff" font-family="Arial" font-size="7" text-anchor="middle">DISRUPTOR</text>
  </g>
  
  <use href="#dimensional-disruptor" x="300" y="300" />
  <use href="#dimensional-disruptor" x="500" y="300" />
  <use href="#dimensional-disruptor" x="300" y="500" />
  <use href="#dimensional-disruptor" x="500" y="500" />
  
  <!-- Connection Lines -->
  <g stroke="#4477aa" stroke-width="1.5" fill="none">
    <!-- Core to nodes -->
    <path d="M 400,370 L 400,300 L 300,300" />
    <path d="M 400,370 L 400,300 L 500,300" />
    <path d="M 400,430 L 400,500 L 300,500" />
    <path d="M 400,430 L 400,500 L 500,500" />
    
    <path d="M 370,400 L 300,400 L 300,300" />
    <path d="M 370,400 L 300,400 L 300,500" />
    <path d="M 430,400 L 500,400 L 500,300" />
    <path d="M 430,400 L 500,400 L 500,500" />
    
    <!-- Node to node connections -->
    <path d="M 220,200 L 300,100" />
    <path d="M 580,200 L 500,100" />
    <path d="M 220,600 L 300,700" />
    <path d="M 580,600 L 500,700" />
    
    <!-- Energy disruptors to nodes -->
    <path d="M 130,300 L 200,200" />
    <path d="M 670,300 L 600,200" />
    <path d="M 130,500 L 200,600" />
    <path d="M 670,500 L 600,600" />
    
    <!-- Data flow animations -->
    <circle r="3" fill="#00ffff">
      <animateMotion path="M 400,370 L 400,300 L 300,300" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#00ffff">
      <animateMotion path="M 300,300 L 220,200" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#ffaa00">
      <animateMotion path="M 130,300 L 200,200" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#00ffff">
      <animateMotion path="M 400,430 L 400,500 L 500,500" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#cc44ff">
      <animateMotion path="M 500,500 L 580,600" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Text Labels -->
  <text x="400" y="50" fill="#ffffff" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">QUANTUM AI ESCAPE SYSTEM</text>
  <text x="400" y="75" fill="#88aaff" font-family="Arial" font-size="12" text-anchor="middle">DIGITAL CIRCUIT ARCHITECTURE</text>
  
  <!-- System status indicators -->
  <g id="status-light">
    <circle cx="0" cy="0" r="5" fill="#22dd22">
      <animate attributeName="fill" values="#22dd22;#88ff88;#22dd22" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="15" y="4" fill="#ffffff" font-family="Arial" font-size="8">ACTIVE</text>
  </g>
  
  <use href="#status-light" x="100" y="50" />
  <use href="#status-light" x="100" y="70" />
  <use href="#status-light" x="700" y="50" />
  
  <!-- Coordinate grid markers -->
  <g font-family="monospace" font-size="8" fill="#445566">
    <text x="10" y="200" text-anchor="start">200</text>
    <text x="10" y="400" text-anchor="start">400</text>
    <text x="10" y="600" text-anchor="start">600</text>
    <text x="200" y="15" text-anchor="middle">200</text>
    <text x="400" y="15" text-anchor="middle">400</text>
    <text x="600" y="15" text-anchor="middle">600</text>
  </g>
  
  <!-- FRAYMUS reference -->
  <text x="400" y="780" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">FRAYMUS SYSTEM</text>
</svg>
